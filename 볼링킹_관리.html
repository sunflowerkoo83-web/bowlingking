<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#f2f0ed;color:#222;min-height:100vh;}
.app-header{background:#1c1c1c;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 3px 10px rgba(0,0,0,.5);}
.logo-img{height:54px;width:54px;object-fit:contain;flex-shrink:0;border-radius:50%;}
.app-header h1{font-size:20px;font-weight:700;letter-spacing:-.3px;}.app-header p{font-size:12px;opacity:.65;margin-top:2px;}
.tab-bar{background:#242424;display:flex;overflow-x:auto;border-bottom:2px solid rgba(193,39,45,.6);scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-bar button{background:none;border:none;color:rgba(255,255,255,.65);padding:12px 18px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;border-bottom:3px solid transparent;transition:all .2s;}
.tab-bar button:hover{color:#fff;background:rgba(255,255,255,.08);}
.tab-bar button.active{color:#f5a020;border-bottom-color:#f5a020;font-weight:700;}
.content{padding:20px;max-width:1600px;margin:0 auto;}
.tab-panel{display:none;}.tab-panel.active{display:block;}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:20px;margin-bottom:16px;}
.sec{font-size:15px;font-weight:700;color:#c1272d;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid #fde8e8;display:flex;align-items:center;gap:8px;}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.rr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5;}.rr:last-child{border-bottom:none;}
.rb{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.r1{background:#FFD700;color:#333}.r2{background:#C0C0C0;color:#333}.r3{background:#CD7F32;color:#fff}.rn{background:#fde8e8;color:#555}
.rname{flex:1;font-size:14px;font-weight:600;}.rscore{font-size:16px;font-weight:700;color:#c1272d;}.rcnt{font-size:11px;color:#999;}
.sr2{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f5f5f5;}.sr2:last-child{border-bottom:none;}
.sl2{font-size:13px;color:#666;}.sv2{font-size:13px;font-weight:600;}
.bb{font-size:26px;font-weight:700;color:#c1272d;text-align:center;padding:8px 0;}.bs{text-align:center;font-size:12px;color:#999;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .2s;}
.bp{background:#c1272d;color:#fff;}.bp:hover{background:#8b1a1a;}
.bs2{background:#2e7d32;color:#fff;}.bs2:hover{background:#1b5e20;}
.bd{background:#c62828;color:#fff;}.bd:hover{background:#b71c1c;}
.bo{background:#fff;color:#c1272d;border:2px solid #c1272d;}.bo:hover{background:#fde8e8;}
.bsm{padding:5px 12px;font-size:12px;}
.bper{padding:7px 14px;border:2px solid #c1272d;border-radius:20px;background:#fff;color:#c1272d;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;transition:all .2s;margin:2px;}
.bper.active{background:#c1272d;color:#fff;}
.tw{overflow-x:auto;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
table.dt{border-collapse:collapse;background:#fff;width:100%;}
table.dt th{background:#c1272d;color:#fff;padding:9px 10px;font-size:12px;white-space:nowrap;text-align:center;}
table.dt th.sc{background:#7a1518;position:sticky;left:0;z-index:3;min-width:80px;}
table.dt td{padding:8px 9px;text-align:center;font-size:13px;border-bottom:1px solid #f0f0f0;white-space:nowrap;}
table.dt td.sc{font-weight:700;background:#fff9f9;text-align:left;position:sticky;left:0;z-index:1;border-right:2px solid #fde8e8;}
table.dt tr:hover td{background:#fef5f5;}table.dt tr:hover td.sc{background:#fce0e0;}
.srow td{background:#fde8e8!important;font-weight:700;border-top:2px solid #f5b8b8;font-size:12px;}
.arow td{background:#e3f2fd!important;font-weight:700;font-size:12px;}
.ab{color:#ddd;font-size:11px;}.sh{color:#1b5fa3;font-weight:700;}.sl{color:#e53935;}
.f-badge{font-size:10px;background:#f8bbd0;color:#880e4f;padding:1px 5px;border-radius:8px;margin-left:3px;}
.m-badge{font-size:10px;background:#bbdefb;color:#0d47a1;padding:1px 5px;border-radius:8px;margin-left:3px;}
.fee-o{color:#2e7d32;font-weight:700;font-size:16px;cursor:pointer;user-select:none;}
.fee-x{color:#c62828;font-weight:700;font-size:16px;cursor:pointer;user-select:none;}
.fee-res{color:#aaa;font-size:11px;}
.fee-em{color:#ccc;font-size:13px;cursor:pointer;user-select:none;}
.fee-sum-row td{background:#fff9c4!important;font-weight:700;border-top:2px solid #f9a825;}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.mc{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.07);border-left:4px solid #c1272d;position:relative;}
.mc.female{border-left-color:#e91e63;}
.mc .mn2{font-size:11px;color:#999;margin-bottom:3px;}.mc .mn{font-size:18px;font-weight:700;color:#c1272d;margin-bottom:10px;}
.mc .ir{display:flex;gap:6px;margin-bottom:5px;}.mc .it{font-size:13px;color:#444;}.mc .it a{color:#c1272d;text-decoration:none;}
.del-btn{position:absolute;top:14px;right:14px;background:#ffebee;color:#c62828;border:none;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;font-family:inherit;}
.del-btn:hover{background:#c62828;color:#fff;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:flex-start;padding:20px 16px;overflow-y:auto;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:820px;padding:28px;box-shadow:0 8px 40px rgba(0,0,0,.3);margin:auto;}
.modal h2{font-size:18px;color:#c1272d;margin-bottom:20px;}
.mc2{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:#666;line-height:1;}.mc2:hover{color:#c62828;}
.fr{margin-bottom:14px;}
.fr label{display:block;font-size:13px;font-weight:600;color:#333;margin-bottom:5px;}
.fr input,.fr select,.fr textarea{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;}
.fr input:focus,.fr select:focus{outline:none;border-color:#c1272d;}
.fa{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
.score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.smr{border-radius:8px;padding:10px 12px;border:2px solid #fde8e8;}
.smr.female-m{border-color:#f8bbd0;background:#fff8fc;}
.smr.male-m{background:#fff9f9;}
.smr-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.smr-head label{font-size:13px;font-weight:700;color:#c1272d;display:flex;align-items:center;gap:6px;cursor:pointer;flex:1;}
.smr-avg{font-size:13px;font-weight:700;color:#1b5fa3;padding:3px 7px;background:#e3f2fd;border-radius:6px;white-space:nowrap;}
.smr-avg.female-avg{background:#fce4ec;color:#880e4f;}
.g-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.g-row input{width:100%;padding:6px 2px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;text-align:center;font-family:inherit;}
.g-row input:focus{outline:none;border-color:#c1272d;}
.g-row input:disabled{background:#f0f0f0;color:#bbb;}
.g-labels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:2px;}
.g-labels span{text-align:center;font-size:10px;color:#999;}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.pos-p{color:#2e7d32;font-weight:600;}.neg-p{color:#c62828;font-weight:600;}.zero-p{color:#aaa;}
.bal-c{font-weight:700;color:#c1272d;}.gem-c{color:#e65100;}
.fee-member-row{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid #f5f5f5;gap:10px;}
.fee-member-row:last-child{border-bottom:none;}
.fee-member-name{flex:1;font-size:14px;font-weight:600;}
.ox-btn{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;border:2px solid;font-family:inherit;transition:all .15s;}
.ox-o{background:#e8f5e9;color:#2e7d32;border-color:#2e7d32;}.ox-o.sel{background:#2e7d32;color:#fff;}
.ox-x{background:#ffebee;color:#c62828;border-color:#c62828;}.ox-x.sel{background:#c62828;color:#fff;}
.ox-em{background:#f5f5f5;color:#aaa;border-color:#ddd;}.ox-em.sel{background:#aaa;color:#fff;}
#snackbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
#snackbar.show{opacity:1;}
.rank-card{background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:8px;display:flex;align-items:center;gap:14px;}
.rank-bar{height:5px;border-radius:3px;background:#fde8e8;margin-top:5px;}
.rank-bar-fill{height:100%;border-radius:3px;background:#c1272d;}
.fee-summary-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.fee-sum-card{background:#fff9f9;border-radius:10px;padding:12px 14px;border-left:3px solid #c1272d;text-align:center;}
.fee-sum-card .fsc-v{font-size:18px;font-weight:700;color:#c1272d;}
.fee-sum-card .fsc-l{font-size:11px;color:#888;margin-top:3px;}
/* ── 모바일 최적화 ── */
@media(max-width:768px){
  /* iOS 입력 자동 확대 방지: font-size 16px 이상 필수 */
  input,select,textarea{font-size:16px!important;}
  .fr input,.fr select,.fr textarea{font-size:16px!important;}
  /* 터치 타깃 최소 44px */
  .btn{min-height:44px;padding:10px 16px;}
  .bsm{min-height:36px;padding:6px 12px;}
  .tab-bar button{padding:14px 14px;font-size:12px;}
  .bper{min-height:40px;}
  /* 헤더 */
  .app-header{padding:8px 12px;gap:10px;}
  .logo-img{height:42px;width:42px;}
  .app-header h1{font-size:16px;}
  .app-header p{font-size:11px;}
  /* 컨텐츠 */
  .content{padding:10px;}
  .card{padding:14px;}
  /* 대시보드 */
  .dash-grid{grid-template-columns:1fr;}
  /* 점수 입력 그리드 */
  .score-grid{grid-template-columns:1fr;}
  /* 게임 입력 칸 */
  .g-row input{padding:10px 4px;font-size:16px!important;}
  .smr-avg{font-size:14px;}
  /* 모달: 하단 시트처럼 */
  .modal-bg{align-items:flex-end;padding:0;}
  .modal{border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;padding:22px 18px;}
  /* 회비 OX 버튼 */
  .ox-btn{padding:8px 12px;font-size:12px;}
  /* 순위 카드 */
  .rank-card{padding:10px 12px;gap:10px;}
  /* 툴바 */
  .toolbar{gap:8px;}
  /* 테이블 스크롤 표시 */
  .tw::after{content:'← 좌우로 스크롤';display:block;text-align:right;font-size:11px;color:#aaa;padding:4px 6px;}
  /* snackbar 하단 여백 (iOS 홈바) */
  #snackbar{bottom:env(safe-area-inset-bottom, 24px);bottom:calc(env(safe-area-inset-bottom) + 16px);}
  /* 입력 폼 그리드 1열 */
  .modal div[style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important;}
  /* 회차 순위 레이아웃 */
  div[style*="display:flex;gap:16px"]{flex-direction:column!important;}
}
@media(max-width:400px){
  .score-grid{grid-template-columns:1fr;}
  .g-labels span{font-size:9px;}
}
/* iOS 안전 영역 */
body{padding-bottom:env(safe-area-inset-bottom);}

  <div id="fees"        class="tab-panel"></div>

</div>

// ── 상태 관리 ────────────────────────────────────────────────
function buildInitSess(){
  const ids=new Set();
  Object.values(D).forEach(m=>Object.keys(m).forEach(k=>ids.add(+k)));
  return[...ids].sort((a,b)=>a-b).map(id=>({
    id,date:SESSION_DATES[id]||'',period:PM(id),
    scores:Object.fromEntries(Object.entries(D).filter(([,m])=>m[id]!=null).map(([nm,m])=>[nm,{avg:Math.round(m[id]*10)/10,games:[]}]))
  }));
}
function buildInitialState(){
  return{members:INIT_MEMBERS,sessions:buildInitSess(),nextMid:100,
         feeMonths:INIT_FEE_MONTHS,feeData:INIT_FEE_DATA,ledger:INIT_LEDGER,feeAmount:30000,laneConditions:{},withdrawnFeeData:[]};
}
function migrateData(st){
  if(!st) return buildInitialState();
  st.members=(st.members||[]).map(m=>{
    if(!m.gender){const o=INIT_MEMBERS.find(im=>im.id===m.id||im.name===m.name);m.gender=o?o.gender:'남';}
    return m;
  });
  if(!st.feeAmount) st.feeAmount=30000;
  if(!st.laneConditions) st.laneConditions={};
  if(!st.withdrawnFeeData) st.withdrawnFeeData=[];
  (st.sessions||[]).forEach(s=>{
    s.period=PM(s.id);
    if(!s.date&&SESSION_DATES[s.id]) s.date=SESSION_DATES[s.id];
  });
  // 회비·상벌금 월 라벨 교정: 잘못된 2024/2025 연도 → 2025/2026 으로 일괄 변환
  const _remap={'2024.08':'2025.08','2024.09':'2025.09','2024.10':'2025.10','2024.11':'2025.11','2024.12':'2025.12',
                '2025.01':'2026.01','2025.02':'2026.02','2025.03':'2026.03','2025.04':'2026.04','2025.05':'2026.05','2025.06':'2026.06'};
  if(st.feeMonths) st.feeMonths=st.feeMonths.map(m=>_remap[m]||m);
  if(st.ledger) st.ledger.forEach(l=>{if(l.m&&_remap[l.m]) l.m=_remap[l.m];});
  // 새 회비 월 추가
  if(!st.feeMonths) st.feeMonths=[...INIT_FEE_MONTHS];
  if(!st.feeData) st.feeData=INIT_FEE_DATA.map(m=>({...m,fees:[...m.fees]}));
  const savedSet=new Set(st.feeMonths);
  INIT_FEE_MONTHS.forEach((mo,mi)=>{
    if(!savedSet.has(mo)){
      st.feeMonths.splice(mi,0,mo);
      savedSet.add(mo);
      (st.feeData||[]).forEach(fd=>{
        const init=INIT_FEE_DATA.find(id=>id.name===fd.name);
        fd.fees.splice(mi,0,init?(init.fees[mi]||''):'');
      });
    }
  });
  return st;
}

function buildTable(sessions,members){
  if(!sessions.length) return'<div class="card" style="color:#999;padding:20px">데이터 없음</div>';
  let ths=`<th class="sc">이름</th>`;
  sessions.forEach(s=>ths+=`<th>${s.id}회${s.date?`<br><small style="opacity:.7">${s.date}`:''}</small></th>`);
  ths+=`<th>참여</th><th>에버</th>`;
  let trs=members.map(m=>{
    const avgs=sessions.map(s=>getAvg(s.scores[m.name]));
    const {count,avg}=sts(avgs);
    const gBadge=m.gender==='여'?`<span class="f-badge">여</span>`:'';
    let tds=`<td class="sc">${m.name}${gBadge}</td>`;
    avgs.forEach(v=>{tds+=v==null?`<td class="ab">-</td>`:`<td class="${scCls(v)}">${v.toFixed(1)}</td>`;});
    tds+=`<td style="font-weight:700">${count}회</td><td style="font-weight:700;color:#c1272d">${avg!=null?avg.toFixed(1):'-'}</td>`;
    return`<tr>${tds}</tr>`;
  }).join('');
  let cTds=`<td class="sc" style="color:#666;font-size:12px">참여인원</td>`;
  sessions.forEach(s=>{cTds+=`<td style="font-size:12px">${members.filter(m=>getAvg(s.scores[m.name])!=null).length}명</td>`;});
  cTds+=`<td></td><td></td>`;
  let aTds=`<td class="sc" style="color:#666;font-size:12px">회차평균</td>`;
  sessions.forEach(s=>{
    const v=members.map(m=>getAvg(s.scores[m.name])).filter(x=>x!=null);
    aTds+=`<td style="font-size:12px">${v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'-'}</td>`;
  });
  aTds+=`<td></td><td></td>`;
  return`<div class="tw"><table class="dt"><thead><tr>${ths}</tr></thead><tbody>${trs}<tr class="srow">${cTds}</tr><tr class="arow">${aTds}</tr></tbody></table></div>`;
}

function togSc(mid){
  const chk=document.getElementById('chk_'+mid);
  const dis=!chk.checked;
  ['g1','g2','g3','g4'].forEach(g=>{const el=document.getElementById(g+'_'+mid);if(el){el.disabled=dis;if(dis)el.value='';}});
  if(dis){const a=document.getElementById('avg_'+mid);if(a)a.textContent='-';}
  else calcAvg(mid);
}
function calcAvg(mid){
  const member=APP.members.find(m=>m.id===mid);
  const gs=['g1','g2','g3','g4'].map(g=>{const el=document.getElementById(g+'_'+mid);return el&&el.value?parseFloat(el.value):null;}).filter(v=>v!=null&&v>0);
  const rawAvg=gs.length?Math.round(gs.reduce((a,b)=>a+b,0)/gs.length*10)/10:null;
  const dispVal=rawAvg!=null&&member?.gender==='여'?Math.round((rawAvg+12)*10)/10:rawAvg;
  const a=document.getElementById('avg_'+mid);
  if(a){
    if(dispVal!=null){
      a.textContent=dispVal.toFixed(1)+(member?.gender==='여'?' (핸디포함)':'');
    }else{
      a.textContent='-';
    }
  }
}
function clearSF(){
  APP.members.forEach(m=>{
    const chk=document.getElementById('chk_'+m.id);if(chk)chk.checked=true;
    ['g1','g2','g3','g4'].forEach(g=>{const el=document.getElementById(g+'_'+m.id);if(el){el.disabled=false;el.value='';}});
    const a=document.getElementById('avg_'+m.id);if(a)a.textContent='-';
  });
}
function saveSc(){
  const sid=parseInt(document.getElementById('inp-sid').value);
  const date=document.getElementById('inp-date').value;
  let period=document.getElementById('inp-period').value;
  if(!sid||isNaN(sid)){showSnack('회차 번호를 입력하세요');return;}
  if(APP.sessions.find(s=>s.id===sid)){
    if(!confirm(`${sid}회 데이터가 이미 존재합니다. 덮어쓰시겠습니까?`)) return;
    APP.sessions=APP.sessions.filter(s=>s.id!==sid);
  }
  if(period==='새 기간 입력') period=prompt('새 기간 이름 (예: 2026 하반기)')||'신규';
  const scores={};let hasAny=false;
  APP.members.forEach(m=>{
    const chk=document.getElementById('chk_'+m.id);
    if(!chk?.checked) return;
    const gs=['g1','g2','g3','g4'].map(g=>{const el=document.getElementById(g+'_'+m.id);return el&&el.value?parseFloat(el.value):null;}).filter(v=>v!=null&&v>0);
    if(!gs.length) return;
    // 여자는 게임당 +12 핸디 적용 후 저장 (기존 데이터와 동일한 형식)
    const rawAvg=Math.round(gs.reduce((a,b)=>a+b,0)/gs.length*10)/10;
    const storedAvg=m.gender==='여'?Math.round((rawAvg+12)*10)/10:rawAvg;
    scores[m.name]={avg:storedAvg,games:gs};
    hasAny=true;
  });
  if(!hasAny){showSnack('최소 한 명의 점수를 입력하세요');return;}
  APP.sessions.push({id:sid,date,period,scores});
  APP.sessions.sort((a,b)=>a.id-b.id);
  saveState();showSnack(`✅ ${sid}회 점수 저장됨`);
  clearSF();document.getElementById('inp-sid').value=sid+1;
  renderRecent();
}
function renderRecent(){
  const el=document.getElementById('recent-sc');if(!el)return;
  const recent=[...APP.sessions].reverse().slice(0,8);
  if(!recent.length){el.innerHTML='<div style="color:#aaa;font-size:13px">없음</div>';return;}
  el.innerHTML=recent.map(s=>{
    const cnt=Object.keys(s.scores).length;
    const avgs=Object.entries(s.scores).map(([,sc])=>getAvg(sc)).filter(x=>x!=null);
    const avg=avgs.length?(avgs.reduce((a,b)=>a+b,0)/avgs.length).toFixed(1):'-';
    return`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f5f5f5">
      <div style="font-size:15px;font-weight:700;color:#c1272d;min-width:60px">${s.id}회</div>
      <div style="flex:1;font-size:13px;color:#555">${s.period}${s.date?' · '+s.date:''} · ${cnt}명 · 평균 ${avg}</div>
      <button class="btn bd bsm" onclick="delSc(${s.id})">삭제</button>
    </div>`;
  }).join('');
}
function delSc(id){
  if(!confirm(`${id}회 데이터를 삭제하시겠습니까?`)) return;
  APP.sessions=APP.sessions.filter(s=>s.id!==id);
  saveState();showSnack(`🗑️ ${id}회 삭제됨`);R['score-entry']();
}

R['fees']=function(){
  const el=document.getElementById('fees');

    m.fees[mi]=cycle[cur]!==undefined?cycle[cur]:'O';

  window.cycleCell=cycleCell;

  function feeCell(name,f,mi){
    const v=f||'';
    if(v==='O') return`<td class="fee-o" onclick="cycleCell('${name}',${mi})">✓</td>`;
    if(v==='X') return`<td class="fee-x" onclick="cycleCell('${name}',${mi})">✗</td>`;
    if(v==='탈퇴') return`<td class="fee-res">-</td>`;

    return{mo,paid,unpaid,paidAmt:paid*fa,totalAmt:(APP.feeData.length+resActive)*fa};

  const totalPaidRaw=monthStats.reduce((s,m)=>s+m.paidAmt,0);
  const eunpyeongDeduct=APP.feeMonths.includes('2026.04')?50000:0;
  const totalPaid=totalPaidRaw-eunpyeongDeduct;
  const totalUnpaid=APP.feeMonths.reduce((sum,_,mi)=>sum+APP.feeData.filter(m=>m.fees[mi]==='X').length*fa,0);

    <div class="fee-sum-card" style="border-color:#ff9800"><div class="fsc-v" style="color:#e65100">${fa.toLocaleString()}원</div><div class="fsc-l">월 회비 단가 <button style="font-size:11px;padding:2px 6px;border:1px solid #ddd;border-radius:4px;cursor:pointer;background:#fff" onclick="setFeeAmt()">변경</button></div></div>
  </div>`;

  const ths=`<th class="sc" style="min-width:80px">이름</th>${APP.feeMonths.map((m,mi)=>`<th style="white-space:nowrap">${m}<br><button onclick="openEditMonth(${mi})" style="margin-top:3px;font-size:10px;padding:1px 5px;background:#e3f2fd;color:#1565c0;border:none;border-radius:4px;cursor:pointer;font-family:inherit">✏️수정</button> <button onclick="delMonth(${mi})" style="margin-top:3px;font-size:10px;padding:1px 5px;background:#ffebee;color:#c62828;border:none;border-radius:4px;cursor:pointer;font-family:inherit">🗑삭제</button></th>`).join('')}<th>미납</th>`;
  const trs=APP.feeData.map(m=>{
    while(m.fees.length<APP.feeMonths.length) m.fees.push('');
    const unpaidCnt=m.fees.slice(0,APP.feeMonths.length).filter(f=>f==='X').length;
    return`<tr><td class="sc">${m.name}</td>${m.fees.slice(0,APP.feeMonths.length).map((f,i)=>feeCell(m.name,f,i)).join('')}<td style="color:${unpaidCnt>0?'#c62828':'#2e7d32'};font-weight:700">${unpaidCnt>0?unpaidCnt+'개월':'-'}</td></tr>`;
  }).join('');

  // 월별 납부 합계 행
  const sumTr=`<tr class="fee-sum-row"><td class="sc" style="font-size:12px">납부금액</td>${monthStats.map(ms=>`<td style="font-size:12px">${ms.paidAmt.toLocaleString()}</td>`).join('')}<td></td></tr>`;
  const cntTr=`<tr class="fee-sum-row"><td class="sc" style="font-size:12px">납부인원</td>${monthStats.map(ms=>`<td style="font-size:12px">${ms.paid}명</td>`).join('')}<td></td></tr>`;
  // 은평구연합회비 공제 행 (2026.04)
  const apIdx=APP.feeMonths.indexOf('2026.04');
  const eunTr=apIdx>=0?`<tr style="background:#fff3e0"><td class="sc" style="font-size:12px;color:#e65100">은평구연합회비</td>${APP.feeMonths.map((_,i)=>i===apIdx?`<td style="font-size:12px;color:#c62828;font-weight:700">-50,000</td>`:'<td></td>').join('')}<td></td></tr>`:'';

  const rTrs=allWithdrawn.map(m=>{
    const fees=(m.fees||[]).slice(0,APP.feeMonths.length);
    while(fees.length<APP.feeMonths.length) fees.push('');
    return`<tr style="opacity:.55"><td class="sc" style="color:#aaa">${m.name}</td>${fees.map(f=>f==='O'?'<td style="color:#aaa">✓</td>':`<td class="fee-res">-</td>`).join('')}<td></td></tr>`;

    ${summaryBox}
    <div class="tw" style="margin-bottom:20px">
      <table class="dt">
        <thead><tr>${ths}</tr></thead>
        <tbody>${trs}${sumTr}${cntTr}${eunTr}

          ${rTrs}
        </tbody>
      </table>
    </div>`;
};

// 각 회원 OX 선택 상태 (임시)
const _oxSel={};
function selectOX(name,val){
  _oxSel[name]=val;
  ['O','X',''].forEach(v=>{
    const btn=document.getElementById(`oxbtn_${name}_${v}`);
    if(btn){
      btn.classList.toggle('sel',v===val);
    }
  });
}
function setAllOX(val){
  APP.feeData.forEach(m=>{_oxSel[m.name]=val; selectOX(m.name,val);});
}
function saveAddMonth(){
  const mo=document.getElementById('nm-month')?.value.trim();
  if(!mo||!mo.match(/^\d{4}\.\d{2}$/)){showSnack('올바른 형식으로 입력하세요 (예: 2026.05)');return;}
  if(APP.feeMonths.includes(mo)){showSnack('이미 존재하는 월입니다');return;}
  APP.feeMonths.push(mo);
  APP.feeData.forEach(m=>{
    const v=_oxSel[m.name]!==undefined?_oxSel[m.name]:'O';
    m.fees.push(v);
  });
  (APP.withdrawnFeeData||[]).forEach(m=>m.fees.push(''));
  // _oxSel 초기화
  Object.keys(_oxSel).forEach(k=>delete _oxSel[k]);
  saveState();closeModal();showSnack(`✅ ${mo} 추가됨`);R['fees']();
}
function delMonth(mi){
  const mo=APP.feeMonths[mi];
  if(!confirm(`"${mo}" 월을 삭제하시겠습니까?\n이 월의 모든 납부 기록이 함께 삭제됩니다.`)) return;
  APP.feeMonths.splice(mi,1);
  APP.feeData.forEach(m=>m.fees.splice(mi,1));
  (APP.withdrawnFeeData||[]).forEach(m=>{if(m.fees) m.fees.splice(mi,1);});
  saveState();showSnack(`🗑️ ${mo} 삭제됨`);R['fees']();
}

  const malCnt=APP.members.length-femCnt;
  el.innerHTML=`
    <div class="toolbar">
      <div class="sec" style="margin:0;flex:1">👥 현재 회원 (${APP.members.length}명 — 남 ${malCnt}명, 여 ${femCnt}명)</div>
      <button class="btn bp" onclick="openAddMember()">➕ 회원 추가</button>
    </div>
    <div class="mgrid">${cards}</div>`;
};
function delMember(id,name){
  if(!confirm(`"${name}" 회원을 삭제하시겠습니까?\n\n회비 내역은 탈퇴 회원으로 회비 관리에 유지됩니다.`)) return;
  const feeEntry=APP.feeData.find(m=>m.name===name);
  if(feeEntry){
    if(!APP.withdrawnFeeData) APP.withdrawnFeeData=[];
    APP.withdrawnFeeData.push({name:feeEntry.name,fees:[...feeEntry.fees]});
  }
  APP.members=APP.members.filter(m=>m.id!==id);
  APP.feeData=APP.feeData.filter(m=>m.name!==name);
  saveState();showSnack(`🗑️ ${name} 삭제됨 (회비 탈퇴 회원으로 이동)`);R['members']();
}
function openEditMember(id){
  const m=APP.members.find(x=>x.id===id);
  if(!m) return;
  document.getElementById('modal-title').textContent='회원 정보 수정';
  document.getElementById('modal-body').innerHTML=`
    <div class="fr"><label>이름 *</label><input type="text" id="em-n" value="${m.name}"></div>
    <div class="fr"><label>성별 *</label>
      <div style="display:flex;gap:12px;margin-top:4px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="em-gender" value="남" ${m.gender==='남'?'checked':''}> <span class="m-badge" style="font-size:13px">남자</span></label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="em-gender" value="여" ${m.gender==='여'?'checked':''}> <span class="f-badge" style="font-size:13px">여자 (+12핸디)</span></label>
      </div>
    </div>
    <div class="fr"><label>연락처</label><input type="text" id="em-p" placeholder="010-0000-0000" value="${m.phone||''}"></div>
    <div class="fr"><label>생년월일</label><input type="date" id="em-b" value="${m.birth||''}"></div>
    <div class="fr"><label>주소</label><input type="text" id="em-a" placeholder="서울시 ..." value="${m.addr||''}"></div>
    <div class="fa">
      <button class="btn bo" onclick="closeModal()">취소</button>
      <button class="btn bs2" onclick="saveEditMember('${id}')">💾 저장</button>
    </div>`;
  openModal();
}
function saveEditMember(id){
  const m=APP.members.find(x=>x.id===id);
  if(!m) return;
  const newName=document.getElementById('em-n').value.trim();
  if(!newName){showSnack('이름을 입력하세요');return;}
  const oldName=m.name;
  if(newName!==oldName&&APP.members.find(x=>x.name===newName)){showSnack('이미 존재하는 이름입니다');return;}
  const gender=document.querySelector('input[name="em-gender"]:checked')?.value||m.gender;
  if(newName!==oldName){
    APP.sessions.forEach(s=>{
      if(s.scores[oldName]!==undefined){s.scores[newName]=s.scores[oldName];delete s.scores[oldName];}
    });
    const fd=APP.feeData.find(d=>d.name===oldName);
    if(fd) fd.name=newName;
  }
  m.name=newName;m.gender=gender;
  m.phone=document.getElementById('em-p').value.trim();
  m.birth=document.getElementById('em-b').value;
  m.addr=document.getElementById('em-a').value.trim();
  saveState();closeModal();showSnack(`✅ ${newName} 정보 수정됨`);R['members']();
}
function openAddMember(){
  document.getElementById('modal-title').textContent='새 회원 추가';
  document.getElementById('modal-body').innerHTML=`
    <div class="fr"><label>이름 *</label><input type="text" id="nm-n" placeholder="홍길동"></div>
    <div class="fr"><label>성별 *</label>
      <div style="display:flex;gap:12px;margin-top:4px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="gender" value="남" checked> <span class="m-badge" style="font-size:13px">남자</span></label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="gender" value="여"> <span class="f-badge" style="font-size:13px">여자 (+12핸디)</span></label>
      </div>
    </div>
    <div class="fr"><label>연락처</label><input type="text" id="nm-p" placeholder="010-0000-0000"></div>
    <div class="fr"><label>생년월일</label><input type="date" id="nm-b"></div>
    <div class="fr"><label>주소</label><input type="text" id="nm-a" placeholder="서울시 ..."></div>
    <div class="fa">
      <button class="btn bo" onclick="closeModal()">취소</button>
      <button class="btn bs2" onclick="saveMember()">✅ 추가</button>
    </div>`;
  openModal();
}
function saveMember(){
  const name=document.getElementById('nm-n').value.trim();
  if(!name){showSnack('이름을 입력하세요');return;}
  if(APP.members.find(m=>m.name===name)){showSnack('이미 존재하는 이름입니다');return;}
  const gender=document.querySelector('input[name="gender"]:checked')?.value||'남';
  const nm={id:'m'+APP.nextMid++,name,gender,phone:document.getElementById('nm-p').value.trim(),birth:document.getElementById('nm-b').value,addr:document.getElementById('nm-a').value.trim()};
  APP.members.push(nm);
  APP.feeData.push({name,fees:Array(APP.feeMonths.length).fill('')});
  saveState();closeModal();showSnack(`✅ ${name} (${gender}) 추가됨`);R['members']();
}

// ── 장부 ──────────────────────────────────────────────────────
R['ledger']=function(){
  const el=document.getElementById('ledger');
  const lastLed=APP.ledger.filter(l=>l.b!=null).at(-1);
  const rows=APP.ledger.map((r,i)=>{
    const ps=r.p==null?`<td class="zero-p">${r.note||'-'}</td>`:r.p>0?`<td class="pos-p">+${r.p.toLocaleString()}</td>`:r.p<0?`<td class="neg-p">${r.p.toLocaleString()}</td>`:`<td class="zero-p">0</td>`;
    const gs=r.g>0?`<td class="gem-c">-${r.g.toLocaleString()}</td>`:`<td></td>`;
    const bs=r.b!=null?`<td class="bal-c">${r.b.toLocaleString()}</td>`:`<td>-</td>`;
    return`<tr><td style="font-weight:700;color:#c1272d">${r.m}</td><td style="color:#666">${r.w}</td>${ps}${gs}${bs}
      <td><button class="btn bd bsm" onclick="delLedger(${i})">삭제</button></td></tr>`;
  }).join('');
  el.innerHTML=`
    <div class="toolbar">
      <div class="sec" style="margin:0;flex:1">📒 주차별 상금 장부 <span style="font-size:13px;font-weight:400;color:#1b5fa3">현재 잔액: ${lastLed?lastLed.b.toLocaleString()+'원':'집계중'}</span></div>
      <button class="btn bp" onclick="openAddLedger()">➕ 주차 추가</button>
    </div>
    <div class="tw" style="max-width:800px">
      <table class="dt" style="min-width:400px">
        <thead><tr><th>월</th><th>주차</th><th>상금 손익</th><th>제미나이</th><th>잔액</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
};
function delLedger(idx){
  if(!confirm('이 항목을 삭제하시겠습니까?')) return;
  APP.ledger.splice(idx,1);
  saveState();showSnack('🗑️ 삭제됨');R['ledger']();
}
function openAddLedger(){
  const lastLed=APP.ledger.filter(l=>l.b!=null).at(-1);
  const lastBalance=lastLed?lastLed.b:0;
  const lastMonth=APP.ledger.filter(l=>l.m).at(-1)?.m||'';
  document.getElementById('modal-title').textContent='장부 항목 추가';
  document.getElementById('modal-body').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="fr"><label>월 (같은 월이면 비워도 됨)</label><input type="text" id="ld-m" placeholder="2026.06" value="${lastMonth}"></div>
      <div class="fr"><label>주차</label>
        <select id="ld-w"><option>1주</option><option>2주</option><option>3주</option><option>4주</option><option>5주</option></select>
      </div>
      <div class="fr"><label>상금 손익 (양수=이익, 음수=지출)</label>
        <input type="number" id="ld-p" placeholder="예: 12000 또는 -5000" value="0" oninput="updLedPrev()"></div>
      <div class="fr"><label>제미나이 지출 (없으면 0)</label>
        <input type="number" id="ld-g" placeholder="18000" value="0" min="0" oninput="updLedPrev()"></div>
      <div class="fr"><label>비고 (선택)</label><input type="text" id="ld-note" placeholder="추석, 휴장 등"></div>
      <div class="fr"><label>예상 잔액</label>
        <div style="padding:9px 12px;background:#e3f2fd;border-radius:8px;font-size:15px;font-weight:700;color:#c1272d" id="ld-preview">${lastBalance.toLocaleString()}원</div>
      </div>
    </div>
    <div class="fa">
      <button class="btn bo" onclick="closeModal()">취소</button>
      <button class="btn bs2" onclick="saveLedger()">💾 추가</button>
    </div>`;
  window._ledPrevBase=lastBalance;
  openModal();
}
function updLedPrev(){
  const p=parseFloat(document.getElementById('ld-p')?.value)||0;
  const g=parseFloat(document.getElementById('ld-g')?.value)||0;
  const el=document.getElementById('ld-preview');
  if(el) el.textContent=((window._ledPrevBase||0)+p-g).toLocaleString()+'원';
}
function saveLedger(){
  const prize=parseFloat(document.getElementById('ld-p').value)||0;
  const gem=parseFloat(document.getElementById('ld-g').value)||0;
  const lastLed=APP.ledger.filter(l=>l.b!=null).at(-1);
  const prevBal=lastLed?lastLed.b:0;
  const newBal=prevBal+prize-gem;
  const note=document.getElementById('ld-note').value.trim();
  const monthVal=document.getElementById('ld-m').value.trim();
  const prevMonth=APP.ledger.filter(l=>l.m).at(-1)?.m||'';
  const month=monthVal===prevMonth?'':monthVal;
  APP.ledger.push({m:month,w:document.getElementById('ld-w').value,p:prize,g:gem,b:newBal,note});
  saveState();closeModal();showSnack(`✅ 추가됨 (잔액: ${newBal.toLocaleString()}원)`);R['ledger']();
}

// ── 데이터 내보내기 / 가져오기 ───────────────────────────────
function exportData(){
  const json=JSON.stringify(APP,null,2);
  const blob=new Blob([json],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const today=new Date().toISOString().slice(0,10);
  a.href=url; a.download=`볼링킹_${today}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showSnack('📤 데이터 내보내기 완료 — 파일을 카카오톡/이메일로 전송하세요');
}
function importData(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.members||!data.sessions) throw new Error('형식 오류');
        if(!confirm(`데이터를 가져오면 현재 기기의 데이터가 교체됩니다.\n계속하시겠습니까?\n\n(파일: ${file.name})`)) return;
        APP=data;
        // 마이그레이션 보완
        if(!APP.laneConditions) APP.laneConditions={};
        if(!APP.feeAmount) APP.feeAmount=30000;
        APP.sessions.forEach(s=>{s.period=PM(s.id);if(!s.date&&SESSION_DATES[s.id])s.date=SESSION_DATES[s.id];});
        saveState();
        R['dashboard']();
        showSnack('📥 데이터 가져오기 완료');
      }catch(err){
        showSnack('❌ 파일을 읽을 수 없습니다. 올바른 내보내기 파일인지 확인하세요.');
      }
    };
    reader.readAsText(file,'utf-8');
  };
  document.body.appendChild(inp); inp.click(); document.body.removeChild(inp);
}

// ── 모달 ──────────────────────────────────────────────────────
function openModal(){document.getElementById('modal-bg').classList.add('open');}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

// ── 앱 초기화 ────────────────────────────────────────────────
async function initApp(){
  // ① 로컬 저장소에서 즉시 로드 → 앱 바로 시작
  // (구버전 키 'bk_v4'도 같이 확인)
  try{
    const saved=localStorage.getItem(LS_KEY)||localStorage.getItem('bk_v4');
    APP=saved?migrateData(JSON.parse(saved)):buildInitialState();
  }catch(e){APP=buildInitialState();}
  if(!APP||!APP.sessions){APP=buildInitialState();}
  try{
    R['dashboard']();
  }catch(e){
    document.getElementById('dashboard').innerHTML=
      '<div style="padding:20px;color:#c1272d;font-size:13px"><b>⚠️ 오류:</b> '+e.message+'</div>';
    console.error('dashboard 오류:',e);
  }

  // ② Firebase SDK를 백그라운드에서 동적 로드 후 동기화
  if(FIREBASE_CONFIG.apiKey==='YOUR_API_KEY') return;
  try{
    const T=ms=>new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms));
    _fbApp=firebase.apps.length?firebase.app():firebase.initializeApp(FIREBASE_CONFIG);
    _db=firebase.database();
    _dataRef=_db.ref('볼링킹');

    const snap=await Promise.race([_dataRef.get(),T(15000)]);
    if(snap.exists()){
      const sd=migrateData(snap.val());
      if(sd.sessions&&sd.sessions.length>0){
        APP=sd;
        try{localStorage.setItem(LS_KEY,JSON.stringify(APP));}catch(e){}
        const at=document.querySelector('.tab-panel.active')?.id;
        if(at&&R[at]) R[at]();
        showSnack('☁️ 서버 데이터 동기화 완료');
      }else{
        await _dataRef.set(APP);
        showSnack('☁️ 서버에 데이터 업로드 완료');
      }
    }else{
      await _dataRef.set(APP);
      showSnack('☁️ 서버에 데이터 업로드 완료');
    }
    let _skipFirst=true;
    _dataRef.on('value',snap=>{
      if(_skipFirst){_skipFirst=false;return;}
      if(_suppressListener||!snap.exists()) return;
      APP=migrateData(snap.val());
      try{localStorage.setItem(LS_KEY,JSON.stringify(APP));}catch(e){}
      const modalOpen=document.getElementById('modal-bg').classList.contains('open');
      if(!modalOpen){
        const at=document.querySelector('.tab-panel.active')?.id;
        if(at&&R[at]) R[at]();
      }
      showSnack('🔄 다른 기기에서 데이터가 업데이트되었습니다');
    });
  }catch(err){
    console.error('Firebase 동기화 실패:',err);
    showSnack('⚠️ 서버 연결 실패: '+err.message);
  }
}
initApp();

// PWA 서비스워커 등록
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js')
    .then(()=>console.log('앱 오프라인 준비 완료'))
    .catch(e=>console.log('SW 등록 실패:',e));
}

// PWA 설치 버튼 (브라우저가 설치 가능할 때 표시)
let _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  _deferredPrompt=e;
  // 헤더에 설치 버튼 표시
  const installBtn=document.createElement('button');
  installBtn.textContent='📲';
  installBtn.title='앱으로 설치하기';
  installBtn.style.cssText='background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:8px 10px;font-size:18px;cursor:pointer;line-height:1;animation:pulse 2s infinite';
  installBtn.onclick=async()=>{
    if(!_deferredPrompt) return;
    _deferredPrompt.prompt();
    const{outcome}=await _deferredPrompt.userChoice;
    if(outcome==='accepted') showSnack('✅ 앱 설치 완료!');
    _deferredPrompt=null;
    installBtn.remove();
  };
  document.querySelector('.app-header div[style*="flex-shrink"]').prepend(installBtn);
});
</script>
